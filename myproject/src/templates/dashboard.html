<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Wiki — Главная</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding-top: 10vh;
            margin: 0;
        }

        .wrapper {
            width: 600px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            border-radius: 90px;
            outline: none;
            margin-bottom: 30px;
        }

        .item {
            padding: 15px;
            border-bottom: 1px solid #222;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }

        .item:hover {
            background: #111;
            border-radius: 10px;
        }

        b {
            color: #fff;
            display: block;
            font-size: 1.2rem;
        }

        small {
            color: #888;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <h1>WIKI</h1>
        <input type="text" placeholder="Поиск..." onkeyup="search(this.value)">
        <div id="res">
            {% for i in articles %}
            <!-- Ссылка ведет на /article/id -->
            <div class="item" onclick="location.href='/article/{{i.id}}'">
                <b>{{i.name}}</b>
                <small>{{i.preview}}</small>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        async function search(q) {
            const div = document.getElementById('res');
            if (q.length < 1) return location.reload();
            const r = await fetch(`/api/search?q=${q}`);
            const data = await r.json();
            div.innerHTML = data.results.map(i => `
                <div class="item" onclick="location.href='/article/${i.id}'">
                    <b>${i.name}</b><small>${i.preview}</small>
                </div>`).join('');
        }
    </script>
</body>

</html>
