<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Wiki — Главная</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding-top: 10vh;
            margin: 0;
            min-height: 100vh;
        }

        .wrapper {
            width: 500px;
            text-align: center;
        }

        /* --- ВРЕМЯ СОЗДАНИЯ СЛЕВА СНИЗУ --- */
        #recent-activity-box {
            position: fixed;
            left: 30px;
            bottom: 30px;
            text-align: left;
            border-left: 1px solid #111;
            padding-left: 15px;
            z-index: 10;
        }

        /* Надпись "Последние статьи" */
        .recent-title {
            color: #222;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            user-select: none;
        }

        .recent-content {
            font-size: 0.8rem;
            color: #444;
        }

        /* ----------------------- */

        h1 {
            cursor: pointer;
            user-select: none;
            transition: 0.3s;
        }

        h1:hover {
            color: #333;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            border-radius: 90px;
            outline: none;
            margin-bottom: 20px;
        }

        #admin-panel {
            display: none;
            margin-bottom: 30px;
            padding: 20px;
            border: 1px dashed #222;
            border-radius: 20px;
        }

        .admin-input {
            border-bottom: 1px solid #333;
            border-radius: 0;
            background: transparent;
            width: 80%;
        }

        .item {
            padding: 15px;
            border-bottom: 1px solid #222;
            text-align: left;
            cursor: pointer;
        }

        .item:hover {
            background: #111;
        }

        b {
            color: #fff;
            display: block;
        }

        small {
            color: #888;
        }
    </style>
</head>

<body>

    <!-- Блок в углу с заголовком -->
    <div id="recent-activity-box">
        <div class="recent-title">Последние статьи</div>
        <div class="recent-content" id="recent-list">
        </div>
    </div>

    <div class="wrapper">
        <h1 onclick="toggleAdmin()">WIKI</h1>

        <div id="admin-panel">
            <small style="display:block; margin-bottom:10px;">ENCRYPTED ACCESS</small>
            <input type="password" id="adminKey" class="admin-input" placeholder="KEY..."
                onkeydown="if(event.key==='Enter') login()">
        </div>

<!-- Форма регистрации и входа -->
<div id="auth-block">

  <!-- Кнопки переключения между формами -->
    <button onclick="showForm('login')">Войти</button>
    <button onclick="showForm('register')">Зарегистрироваться</button>

  <!-- Форма входа -->
    <div id="form-login">
    <h2>Вход</h2>
    <input id="login-username" type="text" placeholder="Логин"><br>
    <input id="login-password" type="password" placeholder="Пароль"><br>
    <button onclick="doLogin()">Войти</button>
  </div>

  <!-- Форма регистрации (скрыта по умолчанию) -->
  <div id="form-register" style="display:none">
    <h2>Регистрация</h2>
    <input id="reg-username" type="text" placeholder="Придумайте логин"><br>
    <input id="reg-password" type="password" placeholder="Придумайте пароль"><br>
    <button onclick="doRegister()">Зарегистрироваться</button>
  </div>

  <!-- Сюда будет выводиться результат -->
  <p id="auth-result"></p>

</div>
        <input type="text" placeholder="Поиск..." onkeyup="search(this.value)">

        <div id="res">
            {% for i in articles %}
            <div class="item" onclick="location.href='/article/{{i.id}}'">
                <b>{{i.name}}</b><small>{{i.preview}}</small>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        function toggleAdmin() {
            const panel = document.getElementById('admin-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            if (panel.style.display === 'block') document.getElementById('adminKey').focus();
        }

        async function login() {
            const key = document.getElementById('adminKey').value;
            const response = await fetch('/api/verify-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ secret_key: key })
            });

            if (response.ok) {
                location.href = '/secret';
            } else {
                alert('ACCESS DENIED');
            }
        }


  // Адрес нашего сервера FastAPI
  const API = "http://127.0.0.1:8000";

  // Переключение между формами
  function showForm(name) {
    document.getElementById("form-login").style.display =
      name === "login" ? "block" : "none";
    document.getElementById("form-register").style.display =
      name === "register" ? "block" : "none";
  }

  // Вход - отправляет логин и пароль на POST /login
  async function doLogin() {
    const username = document.getElementById("login-username").value;
    const password = document.getElementById("login-password").value;

    const response = await fetch(API + "/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    const data = await response.json();
    const result = document.getElementById("auth-result");

    if (response.ok) {
      result.style.color = "green";
      result.textContent = "Добро пожаловать, " + data.username + "!";
    } else {
      result.style.color = "red";
      result.textContent = "Ошибка: " + data.detail;
    }
  }

  // Регистрация - отправляет логин и пароль на POST /register
  async function doRegister() {
    const username = document.getElementById("reg-username").value;
    const password = document.getElementById("reg-password").value;

    const response = await fetch(API + "/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    const data = await response.json();
    const result = document.getElementById("auth-result");

    if (response.ok) {
      result.style.color = "green";
      result.textContent = "Регистрация прошла успешно! Теперь войдите.";
    } else {
      result.style.color = "red";
      result.textContent = "Ошибка: " + data.detail;
    }
  }
        async function search(q) {
            const div = document.getElementById('res');
            if (q.length < 1) return location.reload();
            const r = await fetch(`/api/search?q=${q}`);
            const data = await r.json();
            div.innerHTML = data.results.map(i => `
                <div class="item" onclick="location.href='/article/${i.id}'">
                    <b>${i.name}</b><small>${i.preview}</small>
                </div>`).join('');
        }
    
    </script>
</body>

</html>
