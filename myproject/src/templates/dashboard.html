<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Wiki — Главная</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding-top: 10vh;
            margin: 0;
        }

        .wrapper {
            width: 500px;
            text-align: center;
        }

        /* заголовок кликабельныq для вызова логина */
        h1 {
            cursor: pointer;
            user-select: none;
            transition: 0.3s;
        }

        h1:hover {
            color: #333;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            border-radius: 90px;
            outline: none;
            margin-bottom: 20px;
        }

        /* Стили для скрытого поля логина */
        #admin-panel {
            display: none;
            /* Изначально скрыто */
            margin-bottom: 30px;
            padding: 20px;
            border: 1px dashed #222;
            border-radius: 20px;
        }

        .admin-input {
            border-bottom: 1px solid #333;
            border-radius: 0;
            background: transparent;
            width: 80%;
        }

        .item {
            padding: 15px;
            border-bottom: 1px solid #222;
            text-align: left;
            cursor: pointer;
        }

        .item:hover {
            background: #111;
        }

        b {
            color: #fff;
            display: block;
        }

        small {
            color: #888;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <!-- Клик по заголовку откроет поле пароля1 -->
        <h1 onclick="toggleAdmin()">WIKI</h1>

        <!-- vxod v adminky-->
        <div id="admin-panel">
            <small style="display:block; margin-bottom:10px;">ENCRYPTED ACCESS</small>
            <input type="password" id="adminKey" class="admin-input" placeholder="KEY..."
                onkeydown="if(event.key==='Enter') login()">
        </div>

        <input type="text" placeholder="Поиск..." onkeyup="search(this.value)">

        <div id="res">
            {% for i in articles %}
            <div class="item" onclick="location.href='/article/{{i.id}}'">
                <b>{{i.name}}</b><small>{{i.preview}}</small>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        // Функция показать/скрыть 
        function toggleAdmin() {
            const panel = document.getElementById('admin-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            if (panel.style.display === 'block') document.getElementById('adminKey').focus();
        }

        // Функция входа
        async function login() {
            const key = document.getElementById('adminKey').value;

            // rklych na proverky ny xz kak rabotat bydet 
            const response = await fetch('/api/verify-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ secret_key: key })
            });

            if (response.ok) {
                location.href = '/secret'; // Уходим на секретную страницу 6767676767
            } else {
                alert('ACCESS DENIED');
            }
        }

        // поисковик
        async function search(q) {
            const div = document.getElementById('res');
            if (q.length < 1) return location.reload();
            const r = await fetch(`/api/search?q=${q}`);
            const data = await r.json();
            div.innerHTML = data.results.map(i => `
                <div class="item" onclick="location.href='/article/${i.id}'">
                    <b>${i.name}</b><small>${i.preview}</small>
                </div>`).join('');
        }

    </script>
</body>

</html>
