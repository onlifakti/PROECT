<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>{{ article.name }}</title>
    <style>
        body {
            background: #000;
            color: #ccc;
            font-family: sans-serif;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            padding: 50px 20px;
            margin: 0;
        }

        .container {
            max-width: 750px;
            width: 100%;
        }

        .back {
            color: #555;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .back:hover {
            color: #fff;
        }

        .subject {
            color: #444;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            margin-top: 20px;
            border-bottom: 1px solid #111;
            padding-bottom: 10px;
        }

        h1 {
            color: #fff;
            font-size: 2.8rem;
            margin: 10px 0 30px 0;
        }

        .text {
            font-size: 1.15rem;
            white-space: pre-wrap;
            color: #bbb;
        }

        .footer {
            margin-top: 60px;
            font-size: 0.8rem;
            color: #333;
        }
    </style>
</head>
<!-- -->
<body>
    <div class="container">
        <!--Обычная ссылка в виде кнопки, которая возвращает на главную-->
        <a href="/dashboard" class="back">← Назад к поиску</a> 
        <!--Python автоматически подставит предмет или тему статьи из бд-->
        <div class="subject">{{ article.subject }}</div>
        <!--В него подставляется название статьи -->
        <h1>{{ article.name }}</h1>
        <!-- выводится весь длинный текст статьи-->
        <div class="text">{{ article.text }}</div>
        <!-- ТУТ АЙДИ СТАТЬИ КОТОРАЯ СЛЕВА СНИЗУ ВРОДЕ-->
        <div class="footer">ID: {{ article.id }} | {{ article.note }}</div>
    </div>
</body>

</html>
